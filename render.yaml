# Render blueprint: бесплатный web-сервис Маршрутизатора.
# Ключи добавляются в дашборде Render (Environment), в репо не хранятся.
services:
  - type: web
    name: marshrutizator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
